<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>習慣トラッカー</title>
  <meta name="description" content="毎日の習慣をチェックして、連続日数と今月の記録を見るアプリ">
  <meta name="theme-color" content="#2f855a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="習慣">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <h1>習慣トラッカー</h1>
    <p id="today-label" class="today-label"></p>
  </header>

  <main>
    <form id="add-form" class="add-form" autocomplete="off">
      <label for="habit-name" class="visually-hidden">新しい習慣の名前</label>
      <input id="habit-name" name="name" type="text" maxlength="30"
             placeholder="新しい習慣（例：朝の散歩）" enterkeyhint="done">
      <button type="submit">追加</button>
    </form>
    <p id="message" class="message" role="status" aria-live="polite"></p>

    <p id="empty" class="empty" hidden>まだ習慣がありません。<br>上の欄から追加してください。</p>
    <ul id="habit-list" class="habit-list"></ul>

    <section class="data-tools" aria-labelledby="data-tools-title">
      <h2 id="data-tools-title">データの保存と読み込み</h2>
      <div class="data-buttons">
        <button type="button" id="export-btn">書き出し</button>
        <button type="button" id="import-btn">読み込み</button>
      </div>
      <input type="file" id="import-file" accept=".json,application/json" hidden>
      <p id="data-message" class="message" role="status" aria-live="polite"></p>
      <p class="data-note">読み込むと、今の記録と置き換わります。</p>
    </section>
  </main>

  <footer class="app-footer">
    <p>データはこの端末の中だけに保存されます。</p>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
